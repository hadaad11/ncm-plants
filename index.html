<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NCM PLANTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></symbol>
<symbol id="i-factory" viewBox="0 0 24 24"><path d="M3 21V10l6 4V10l6 4V5h6v16z"/></symbol>
<symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/></symbol>
<symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></symbol>
<symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
<symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z M14 3v4h4M9 12h6M9 16h6"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
<symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M9 14l-4-4 4-4M5 10h10a4 4 0 0 1 0 8h-3"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0zM8 21h8"/></symbol>
<symbol id="i-silo" viewBox="0 0 24 24"><path d="M6 21V8a6 4 0 0 1 12 0v13M6 12h12M6 16h12M4 21h16"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
</defs></svg>

<!-- ============ LOGIN ============ -->
<section id="login">
  <div class="glass lbox">
    <img src="ncm-logo.png" alt="NCM">
    <h1>NCM PLANTS</h1>
    <p data-t="Sign in with the username and password you got from the admin|سجّل الدخول باسم المستخدم وكلمة السر اللي أخدتهم من الأدمن"></p>
    <form id="lf" autocomplete="on">
      <label for="lu" data-t="Username|اسم المستخدم"></label>
      <input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="lp" data-t="Password|كلمة السر"></label>
      <input id="lp" type="password" autocomplete="current-password" required>
      <div class="err" id="lerr"></div>
      <button class="btn primary" id="lbtn" type="submit" data-t="Sign in|دخول"></button>
    </form>
    <div class="hint"><button class="btn sm" type="button" onclick="toggleLang()" id="langBtn0">عربي</button></div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app">
  <aside class="side glass" id="side">
    <div class="logo"><img src="ncm-logo.png" alt="NCM"></div>
    <nav class="nav" id="nav"></nav>
    <div class="me"><div class="av" id="meAv">N</div><div><b id="meName"></b><small><span class="dot" id="meDot"></span> <span id="meSub"></span></small></div></div>
    <button class="btn" onclick="logout()"><svg class="i"><use href="#i-out"/></svg><span data-t="Log out|تسجيل خروج"></span></button>
  </aside>

  <main class="main">
    <header class="top glass">
      <button class="btn iconbtn burger" onclick="side.classList.toggle('open')" aria-label="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
      <div class="grow"><h2 id="pTitle"></h2><p id="pSub"></p></div>
      <button class="btn iconbtn" onclick="refresh(true)" title="Refresh" aria-label="Refresh"><svg class="i"><use href="#i-refresh"/></svg></button>
      <button class="btn iconbtn" onclick="toggleTheme()" title="Dark / light" aria-label="Theme"><svg class="i"><use href="#i-moon"/></svg></button>
      <button class="btn sm" onclick="toggleLang()" id="langBtn">عربي</button>
    </header>
    <section id="view" class="page on"></section>
    <div class="foot" id="foot"></div>
  </main>
</div>

<div class="modal" id="modal"><div class="box glass" id="mbox"></div></div>
<div class="toast glass" id="toast"></div>
<script src="app.js?v=13"></script>
</body>
</html>
